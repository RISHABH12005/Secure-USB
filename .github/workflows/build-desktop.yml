name: Build desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SecureMusicUSB-Windows
          - os: macos-latest
            artifact: SecureMusicUSB-macOS
          - os: ubuntu-latest
            artifact: SecureMusicUSB-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Tk support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SecureMusicUSB securemusic_usb.py
      - name: Build macOS executable
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --onefile --name SecureMusicUSB securemusic_usb.py
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean --onefile --name SecureMusicUSB securemusic_usb.py
      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/SecureMusicUSB
            dist/SecureMusicUSB.exe
          if-no-files-found: error
          retention-days: 14
